# FFMPEG_DIR points ffmpeg-sys-the-third (pulled in transitively via the iidx_on_knitting dependency)
# at the vendored trimmed FFmpeg in the sibling iidxOnKnitting repo. Cargo only reads the TOP package's
# .cargo/config.toml, NOT a dependency's, so SdvxOnEar must set this itself even though iidxOnKnitting
# has the same line. `relative = true` resolves against this project root, keeping the repo portable;
# no force= so an external env var still wins.
#
# First clean build also needs LLVM\bin on PATH (or LIBCLANG_PATH set) so bindgen finds libclang.dll.
# Incremental builds need nothing extra (bindings are cached, rustc finds link.exe itself).
[env]
FFMPEG_DIR = { value = "../iidxOnKnitting/vendor", relative = true }
